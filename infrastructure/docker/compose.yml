services:
  postgres:
    image: postgres:17-alpine
    container_name: esmeralda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: esmeralda
      POSTGRES_USER: esmeralda
      POSTGRES_PASSWORD: esmeralda_dev
    ports:
      - "5433:5432"
    volumes:
      - esmeralda_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esmeralda -d esmeralda"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  esmeralda_postgres_data:
